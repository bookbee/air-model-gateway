<text x="35" y="450" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">local + provider: anthropic → 422 (the class doesn&#x27;t offer it)</text>
<text x="20" y="492" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">Rules enforced when routing.yaml loads: a local chain holds only local providers, a cloud chain only cloud ones;</text>
<text x="20" y="508" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">an embedding name states its location and dimensions, and the gateway checks every returned vector against them.</text>
