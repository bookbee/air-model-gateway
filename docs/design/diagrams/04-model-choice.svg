<rect x="20" y="20" width="290" height="300" rx="10" fill="none" stroke="#2F6FDB" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="32" y="38" font-size="12" font-weight="bold" fill="#2F6FDB" text-anchor="start">What a caller sends</text>
<rect x="35" y="50" width="260" height="120" rx="7" fill="#E8F1FD" stroke="#2F6FDB" stroke-width="1.4"/>
<text x="45" y="70" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">POST /v1/generate</text>
<text x="45" y="85.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">model: local | auto | cloud</text>
<text x="45" y="97.0" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">    (default auto)</text>
<text x="45" y="108.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">provider: optional preference</text>
<text x="45" y="120.0" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">pin: provider:model (granted only)</text>
<rect x="35" y="190" width="260" height="110" rx="7" fill="#E8F1FD" stroke="#2F6FDB" stroke-width="1.4"/>
<text x="45" y="210" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">POST /v1/embed</text>
<text x="45" y="225.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">model: a published name, required</text>
<text x="45" y="237.0" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">&lt;local|cloud&gt;-&lt;dims&gt;-v&lt;version&gt;</text>
<text x="45" y="248.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">one model, never a chain</text>
<rect x="345" y="80" width="200" height="92" rx="7" fill="#F1ECFD" stroke="#6B4FD8" stroke-width="1.4"/>
<text x="355" y="100" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Policy grant</text>
<text x="355" y="115.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">model_classes · preferred_providers</text>
<text x="355" y="127.0" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">pin · embed_models</text>
<text x="355" y="138.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">outside it → 403</text>
<rect x="345" y="200" width="200" height="92" rx="7" fill="#E3F5F2" stroke="#0F8C7E" stroke-width="1.4"/>
<text x="355" y="220" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">ModelCatalog</text>
<text x="355" y="235.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">deploy/routing.yaml</text>
<text x="355" y="247.0" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">classes · overrides · embed</text>
<text x="355" y="258.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">meaningless → 422</text>
