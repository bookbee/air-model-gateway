<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" width="1160" height="500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
<title>air-model-gateway: governance</title>
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2430"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6673"/></marker>
<marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker>
</defs>
<rect width="1160" height="500" fill="#FFFFFF"/>
<rect x="20" y="20" width="380" height="470" rx="10" fill="none" stroke="#6B4FD8" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="48" y="38" font-size="12" font-weight="bold" fill="#6B4FD8" text-anchor="start">deploy/policy/policy.&lt;env&gt;.yaml</text>
<text x="36" y="58" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">default_allow: false   # honoured only in local</text>
<text x="36" y="77" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">default_rate_per_minute: 60</text>
<text x="36" y="96" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">provider_quotas:       # all services</text>
<text x="36" y="115" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">  gemini: 600          # calls/minute</text>
<text x="36" y="134" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">services:</text>
<text x="36" y="153" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">  air-rag:</text>
<text x="36" y="172" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">    resources:</text>
<text x="36" y="191" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">      inference: [embed]</text>
<text x="36" y="210" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">    embed_models: [local-768-v1]</text>
<text x="36" y="229" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">    rate_per_minute: 600</text>
<text x="36" y="248" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">    daily_budget_usd: 25.0</text>
<text x="36" y="267" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">  air-web-console:</text>
<text x="36" y="286" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">    resources:</text>
<text x="36" y="305" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">      inference: [generate]</text>
<text x="36" y="324" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">      admin: [admin_read]</text>
<text x="36" y="343" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1F2430" xml:space="preserve">    pin: true</text>
<text x="36" y="380" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">Unlisted fields mean &quot;all&quot;: model_classes,</text>
<text x="36" y="396" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">embed_models and preferred_providers.</text>
<text x="36" y="420" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">Typed at load: an unknown action or class stops</text>
<text x="36" y="436" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">startup. Quota and budget values are examples;</text>
<text x="36" y="452" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">the shipped files set none yet.</text>
<text x="430" y="28" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Production grants (policy.prod.yaml; staging is the same)</text>
<rect x="430" y="40" width="675" height="30" fill="#F1ECFD"/>
<text x="646.0" y="60" font-size="11.5" font-weight="bold" fill="#1F2430" text-anchor="middle">generate</text>
<text x="712.0" y="60" font-size="11.5" font-weight="bold" fill="#1F2430" text-anchor="middle">embed</text>
<text x="783.0" y="60" font-size="11.5" font-weight="bold" fill="#1F2430" text-anchor="middle">admin_read</text>
<text x="855.0" y="60" font-size="11.5" font-weight="bold" fill="#1F2430" text-anchor="middle">classes</text>
<text x="938.5" y="60" font-size="11.5" font-weight="bold" fill="#1F2430" text-anchor="middle">embed models</text>
<text x="1013.0" y="60" font-size="11.5" font-weight="bold" fill="#1F2430" text-anchor="middle">pin</text>
<text x="1070.0" y="60" font-size="11.5" font-weight="bold" fill="#1F2430" text-anchor="middle">rate / min</text>
<rect x="430" y="70" width="675" height="40" fill="#FFFFFF" stroke="#E3E6EB"/>
<text x="440" y="95" font-size="12" font-weight="bold" fill="#2F6FDB" text-anchor="start">air-classifier-service</text>
<text x="646.0" y="95" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="712.0" y="95" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="783.0" y="95" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="855.0" y="95" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">all</text>
<text x="938.5" y="95" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">all</text>
<text x="1013.0" y="95" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="1070.0" y="95" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">300</text>
<rect x="430" y="110" width="675" height="40" fill="#F7F8FA" stroke="#E3E6EB"/>
<text x="440" y="135" font-size="12" font-weight="bold" fill="#2F6FDB" text-anchor="start">air-orchestrator-service</text>
<text x="646.0" y="135" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="712.0" y="135" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="783.0" y="135" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="855.0" y="135" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">all</text>
<text x="938.5" y="135" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">all</text>
<text x="1013.0" y="135" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="1070.0" y="135" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">600</text>
<rect x="430" y="150" width="675" height="40" fill="#FFFFFF" stroke="#E3E6EB"/>
<text x="440" y="175" font-size="12" font-weight="bold" fill="#2F6FDB" text-anchor="start">air-tools</text>
<text x="646.0" y="175" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="712.0" y="175" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="783.0" y="175" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="855.0" y="175" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">all</text>
<text x="938.5" y="175" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="1013.0" y="175" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="1070.0" y="175" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">300</text>
<rect x="430" y="190" width="675" height="40" fill="#F7F8FA" stroke="#E3E6EB"/>
<text x="440" y="215" font-size="12" font-weight="bold" fill="#2F6FDB" text-anchor="start">air-rag</text>
<text x="646.0" y="215" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="712.0" y="215" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="783.0" y="215" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="855.0" y="215" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="938.5" y="215" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">local-768-v1</text>
<text x="1013.0" y="215" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="1070.0" y="215" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">600</text>
<rect x="430" y="230" width="675" height="40" fill="#FFFFFF" stroke="#E3E6EB"/>
<text x="440" y="255" font-size="12" font-weight="bold" fill="#2F6FDB" text-anchor="start">air-web-console</text>
<text x="646.0" y="255" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="712.0" y="255" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="783.0" y="255" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="855.0" y="255" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">all</text>
<text x="938.5" y="255" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="middle">—</text>
<text x="1013.0" y="255" font-size="12" font-weight="normal" fill="#3C8D2F" text-anchor="middle">✓</text>
<text x="1070.0" y="255" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="middle">60</text>
<text x="430" y="300" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">Fails closed</text>
<text x="550" y="300" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="start">Outside local, a service not listed gets nothing (403).</text>
<text x="430" y="324" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">Rate limit</text>
<text x="550" y="324" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="start">Token bucket per service, shared across replicas through Redis.</text>
<text x="430" y="348" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">Provider quota</text>
<text x="550" y="348" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="start">Shared by all services; a spent quota skips that rung.</text>
<text x="430" y="372" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">Daily budget</text>
<text x="550" y="372" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="start">USD per UTC day; then 429 budget_exceeded + Retry-After.</text>
<text x="430" y="396" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">Tokens</text>
<text x="550" y="396" font-size="12" font-weight="normal" fill="#5F6673" text-anchor="start">X-API-Key per service, from Secret Manager; rotation keeps old + new.</text>
