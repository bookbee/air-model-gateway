<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 450" width="1160" height="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
<title>air-model-gateway: streaming</title>
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2430"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6673"/></marker>
<marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker>
</defs>
<rect width="1160" height="450" fill="#FFFFFF"/>
<text x="20" y="75" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Consumer</text>
<line x1="110" y1="70" x2="1140" y2="70" stroke="#D5D9E0" stroke-width="1.2"/>
<text x="20" y="195" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Gateway</text>
<line x1="110" y1="190" x2="1140" y2="190" stroke="#D5D9E0" stroke-width="1.2"/>
<text x="20" y="315" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Provider</text>
<line x1="110" y1="310" x2="1140" y2="310" stroke="#D5D9E0" stroke-width="1.2"/>
<rect x="120" y="30" width="420" height="320" rx="8" fill="#F1ECFD" opacity="0.55"/>
<rect x="560" y="30" width="580" height="320" rx="8" fill="#E3F5F2" opacity="0.6"/>
<text x="130" y="48" font-size="12" font-weight="bold" fill="#6B4FD8" text-anchor="start">Before the first token: plain HTTP</text>
<text x="570" y="48" font-size="12" font-weight="bold" fill="#0F8C7E" text-anchor="start">After it: Server-Sent Events, status already 200</text>
<polyline points="140,70 140,190" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="150" y="130" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">POST stream: true</text>
<polyline points="250,190 250,310" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="258" y="250" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">rung 1</text>
<polyline points="300,310 300,190" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#arrow-error)"/>
<text x="308" y="250" font-size="10.5" font-weight="normal" fill="#C62828" text-anchor="start">fails</text>
<polyline points="380,190 380,310" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="388" y="250" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">rung 2</text>
<polyline points="470,310 470,190" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="478" y="250" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">first token</text>
<text x="130" y="105" font-size="11" font-weight="normal" fill="#5F6673" text-anchor="start">errors here are ordinary 4xx/5xx;</text>
<text x="130" y="120" font-size="11" font-weight="normal" fill="#5F6673" text-anchor="start">the gateway may still fail over</text>
<polyline points="600,190 600,70" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="606" y="120" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">start</text>
<polyline points="700,190 700,70" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="706" y="120" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">delta</text>
<polyline points="780,190 780,70" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="786" y="120" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">delta</text>
<polyline points="860,190 860,70" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="866" y="120" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">delta</text>
<polyline points="1000,190 1000,70" fill="none" stroke="#1F2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="1006" y="120" font-size="10.5" font-weight="normal" fill="#1F2430" text-anchor="start">done</text>
<polyline points="670,310 670,190" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<polyline points="750,310 750,190" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<polyline points="830,310 830,190" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<text x="1008" y="140" font-size="11" font-weight="normal" fill="#5F6673" text-anchor="start">usage, cost,</text>
<text x="1008" y="154" font-size="11" font-weight="normal" fill="#5F6673" text-anchor="start">finish_reason</text>
<rect x="570" y="368" width="270" height="66" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.4"/>
<text x="580" y="387" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">or: error event</text>
<text x="580" y="401.5" font-size="9.5" font-weight="normal" fill="#5F6673" text-anchor="start">provider failed mid-stream, or</text>
<text x="580" y="412.0" font-size="9.5" font-weight="normal" fill="#5F6673" text-anchor="start">no token for 30 s (idle timeout)</text>
<rect x="860" y="368" width="280" height="66" rx="7" fill="#FFF6D9" stroke="#A87F00" stroke-width="1.4"/>
<text x="870" y="387" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">caller disconnects</text>
<text x="870" y="401.5" font-size="9.5" font-weight="normal" fill="#5F6673" text-anchor="start">provider stream closed; audited as</text>
<text x="870" y="412.0" font-size="9.5" font-weight="normal" fill="#5F6673" text-anchor="start">client_disconnected</text>
<rect x="120" y="368" width="420" height="66" rx="7" fill="#F2F3F5" stroke="#5F6673" stroke-width="1.4"/>
<text x="130" y="387" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">bookkeeping runs before done</text>
<text x="130" y="401.5" font-size="9.5" font-weight="normal" fill="#5F6673" text-anchor="start">pricing, spend, cache store, metrics, audit: the same</text>
<text x="130" y="412.0" font-size="9.5" font-weight="normal" fill="#5F6673" text-anchor="start">as a JSON call. No failover once a token has been sent.</text>
<circle cx="125" cy="30" r="11" fill="#1F2430"/>
<text x="125" y="34.2" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="565" cy="30" r="11" fill="#1F2430"/>
<text x="565" y="34.2" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="995" cy="70" r="11" fill="#1F2430"/>
<text x="995" y="74.2" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="565" cy="368" r="11" fill="#1F2430"/>
<text x="565" y="372.2" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="855" cy="368" r="11" fill="#1F2430"/>
<text x="855" y="372.2" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
</svg>
