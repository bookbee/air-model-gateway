<text x="325" y="250" font-size="11" font-weight="normal" fill="#5F6673" text-anchor="middle">HTTP + X-API-Key</text>
<rect x="385" y="70" width="400" height="440" rx="10" fill="none" stroke="#0F8C7E" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="397" y="88" font-size="12" font-weight="bold" fill="#0F8C7E" text-anchor="start">air-model-gateway  (FastAPI · Python 3.12)</text>
<rect x="400" y="100" width="370" height="70" rx="7" fill="#F1ECFD" stroke="#6B4FD8" stroke-width="1.4"/>
<text x="410" y="120" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">HTTP API</text>
<text x="410" y="135.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">POST /v1/generate · POST /v1/embed</text>
<text x="410" y="147.0" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">GET /v1/capabilities · /v1/health · /v1/ready · /metrics</text>
<rect x="400" y="185" width="370" height="62" rx="7" fill="#F1ECFD" stroke="#6B4FD8" stroke-width="1.4"/>
<text x="410" y="205" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Control plane</text>
<text x="410" y="220.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">service tokens · policy grants · rate limits · daily budgets</text>
<rect x="400" y="262" width="370" height="62" rx="7" fill="#E3F5F2" stroke="#0F8C7E" stroke-width="1.4"/>
<text x="410" y="282" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Model catalog</text>
<text x="410" y="297.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">class or embedding name → ordered chain</text>
<rect x="400" y="339" width="370" height="62" rx="7" fill="#E3F5F2" stroke="#0F8C7E" stroke-width="1.4"/>
<text x="410" y="359" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Router</text>
<text x="410" y="374.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">failover · retries · circuit breakers · provider quotas</text>
<rect x="400" y="416" width="370" height="70" rx="7" fill="#FFF6D9" stroke="#A87F00" stroke-width="1.4"/>
<text x="410" y="436" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Bookkeeping</text>
<text x="410" y="451.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">pricing · spend ledger · response cache</text>
<text x="410" y="463.0" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">metrics · model.call audit line</text>
<rect x="880" y="70" width="260" height="200" rx="10" fill="none" stroke="#3C8D2F" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="892" y="88" font-size="12" font-weight="bold" fill="#3C8D2F" text-anchor="start">Local model servers  (free, private)</text>
<rect x="895" y="100" width="230" height="62" rx="7" fill="#E8F5E3" stroke="#3C8D2F" stroke-width="1.4"/>
<text x="905" y="120" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Ollama</text>
<text x="905" y="135.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">llama3.2:3b · ministral-3:3b · nomic-embed-text</text>
<rect x="895" y="180" width="230" height="62" rx="7" fill="#E8F5E3" stroke="#3C8D2F" stroke-width="1.4"/>
<text x="905" y="200" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Self-hosted slot  (llama.cpp)</text>
<text x="905" y="215.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">any OpenAI-compatible server: vLLM, TGI</text>
<rect x="880" y="290" width="260" height="220" rx="10" fill="none" stroke="#D9822B" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="892" y="308" font-size="12" font-weight="bold" fill="#D9822B" text-anchor="start">Cloud APIs  (billed per token)</text>
<rect x="895" y="320" width="230" height="52" rx="7" fill="#FDEFE2" stroke="#D9822B" stroke-width="1.4"/>
<text x="905" y="340" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Gemini</text>
<text x="905" y="355.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">gemini-2.5-flash · 3.1-pro-preview</text>
<rect x="895" y="382" width="230" height="52" rx="7" fill="#FDEFE2" stroke="#D9822B" stroke-width="1.4"/>
<text x="905" y="402" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Anthropic</text>
<text x="905" y="417.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">claude-haiku-4-5 · claude-sonnet-5</text>
<rect x="895" y="444" width="230" height="52" rx="7" fill="#FDEFE2" stroke="#D9822B" stroke-width="1.4"/>
<text x="905" y="464" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">OpenAI</text>
<text x="905" y="479.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">gpt-4o-mini · text-embedding-3-small</text>
