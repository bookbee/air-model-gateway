<text x="45" y="375.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">embed local-768-v1</text>
<polyline points="270,371 380,290" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
