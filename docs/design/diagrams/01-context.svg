<text x="410" y="565" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Redis  (optional)</text>
<text x="410" y="580.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">shared cache, limits, spend</text>
<rect x="595" y="545" width="175" height="62" rx="7" fill="#FFF6D9" stroke="#A87F00" stroke-width="1.4"/>
<text x="605" y="565" font-size="13" font-weight="bold" fill="#1F2430" text-anchor="start">Prometheus · logs</text>
<text x="605" y="580.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">/metrics · JSON lines</text>
<polyline points="487,510 487,545" fill="none" stroke="#5F6673" stroke-width="1.5" marker-start="url(#arrow-muted)" marker-end="url(#arrow-muted)"/>
<polyline points="682,510 682,545" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<rect x="300" y="8" width="560" height="46" rx="7" fill="#F2F3F5" stroke="#5F6673" stroke-width="1.4"/>
<text x="580.0" y="35.0" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="middle">Owner-managed config: deploy/routing.yaml · pricing.yaml · policy/policy.&lt;env&gt;.yaml</text>
<polyline points="585,54 585,70" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<text x="880" y="580" font-size="12" font-weight="bold" fill="#0F8C7E" text-anchor="start">No runtime dependency on any other AIR service.</text>
<text x="880" y="597" font-size="11" font-weight="normal" fill="#5F6673" text-anchor="start">Consumers call it directly; it calls only</text>
<text x="880" y="612" font-size="11" font-weight="normal" fill="#5F6673" text-anchor="start">model servers, cloud APIs and its own Redis.</text>
