<text x="45" y="525.5" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">public APIs, via Cloud NAT</text>
<polyline points="1000,282 1000,300" fill="none" stroke="#5F6673" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
<text x="320" y="500" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">Terraform (deploy/terraform) creates: Memorystore, the secrets and their IAM, Workload Identity bindings;</text>
<text x="320" y="517" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">optionally the VPC, Cloud NAT, Autopilot cluster and Artifact Registry (gke-platform module).</text>
<text x="320" y="534" font-size="11.5" font-weight="normal" fill="#5F6673" text-anchor="start">Helm (deploy/helm + deploy/gke/values-&lt;env&gt;.yaml) creates everything inside ns air-model-gateway.</text>
<text x="320" y="560" font-size="12" font-weight="bold" fill="#1F2430" text-anchor="start">Consumers call http://air-model-gateway.air-model-gateway.svc.cluster.local</text>
