<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 380" width="1150" height="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
<title>air-model-gateway: environments and gates</title>
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2430"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6673"/></marker>
<marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker>
</defs>
<rect width="1150" height="380" fill="#FFFFFF"/>
<rect x="20" y="20" width="262" height="300" rx="9" fill="#E8F5E3" stroke="#3C8D2F" stroke-width="1.4"/>
<text x="34" y="46" font-size="15" font-weight="bold" fill="#1F2430" text-anchor="start">Laptop dev</text>
<text x="34" y="68" font-size="12" font-family="Menlo, Consolas, monospace" fill="#3C8D2F">make run · make up</text>
<text x="34" y="100" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· ENVIRONMENT=local</text>
<text x="34" y="124" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· policy.local.yaml (default allow)</text>
<text x="34" y="148" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· Redis: none, or REDIS=infra</text>
<text x="34" y="172" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· native Ollama (Metal GPU)</text>
<text x="34" y="196" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· port 8083</text>
<rect x="34" y="250" width="234" height="50" rx="7" fill="#FFFFFF" stroke="#3C8D2F"/>
<text x="44" y="270" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">Gate</text>
<text x="44" y="289" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1F2430">make verify</text>
<rect x="302" y="20" width="262" height="300" rx="9" fill="#E3F5F2" stroke="#0F8C7E" stroke-width="1.4"/>
<text x="316" y="46" font-size="15" font-weight="bold" fill="#1F2430" text-anchor="start">Integration stack</text>
<text x="316" y="68" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0F8C7E">make integration-up</text>
<text x="316" y="100" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· ENVIRONMENT=staging</text>
<text x="316" y="124" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· policy.staging.yaml, fails closed</text>
<text x="316" y="148" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· 2 replicas behind nginx :9083</text>
<text x="316" y="172" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· shared Redis, generated tokens</text>
<text x="316" y="196" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· for consumers on the laptop</text>
<rect x="316" y="250" width="234" height="50" rx="7" fill="#FFFFFF" stroke="#0F8C7E"/>
<text x="326" y="270" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">Gate</text>
<text x="326" y="289" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1F2430">make integration-test</text>
<polyline points="284,170 300,170" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<rect x="584" y="20" width="262" height="300" rx="9" fill="#EEF1FE" stroke="#4F46E5" stroke-width="1.4"/>
<text x="598" y="46" font-size="15" font-weight="bold" fill="#1F2430" text-anchor="start">kind cluster</text>
<text x="598" y="68" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4F46E5">make kind-up</text>
<text x="598" y="100" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· the Helm chart, prod values</text>
<text x="598" y="124" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· policy.prod.yaml</text>
<text x="598" y="148" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· TLS + AUTH Redis</text>
<text x="598" y="172" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· NetworkPolicy enforced</text>
<text x="598" y="196" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· two workers in two zones</text>
<rect x="598" y="250" width="234" height="50" rx="7" fill="#FFFFFF" stroke="#4F46E5"/>
<text x="608" y="270" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">Gate</text>
<text x="608" y="289" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1F2430">make kind-test</text>
<polyline points="566,170 582,170" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<rect x="866" y="20" width="262" height="300" rx="9" fill="#FDEFE2" stroke="#D9822B" stroke-width="1.4"/>
<text x="880" y="46" font-size="15" font-weight="bold" fill="#1F2430" text-anchor="start">GKE staging · prod</text>
<text x="880" y="68" font-size="12" font-family="Menlo, Consolas, monospace" fill="#D9822B">Deploy workflow</text>
<text x="880" y="100" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· ENVIRONMENT=staging | prod</text>
<text x="880" y="124" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· policy.&lt;env&gt;.yaml</text>
<text x="880" y="148" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· Memorystore, Secret Manager</text>
<text x="880" y="172" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· in-cluster only</text>
<text x="880" y="196" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">· same image digest in both</text>
<rect x="880" y="250" width="234" height="50" rx="7" fill="#FFFFFF" stroke="#D9822B"/>
<text x="890" y="270" font-size="10.5" font-weight="normal" fill="#5F6673" text-anchor="start">Gate</text>
<text x="890" y="289" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1F2430">make gke-smoke</text>
<polyline points="848,170 864,170" fill="none" stroke="#5F6673" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<text x="20" y="350" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">Definition of done: make verify (what CI runs). A change to runtime behaviour, deployment or a consumer-visible contract</text>
<text x="20" y="368" font-size="12" font-weight="normal" fill="#1F2430" text-anchor="start">also passes make kind-up kind-test and make integration-up integration-test.</text>
</svg>
