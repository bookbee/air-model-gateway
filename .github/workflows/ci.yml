name: CI

# The same gates as `make verify` on a laptop (docs/05-handover.md §2): a
# change is done when every job here is green.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Lint, typecheck, tests with the coverage floor, OpenAPI drift, lock freshness.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - run: make dev
      - run: make check
      - run: make lock-check
      - name: OpenAPI document is current
        run: make openapi && git diff --exit-code docs/openapi.json

  supply-chain:
    # Known vulnerabilities in the locked runtime dependencies, script and
    # Dockerfile lint, and the image itself builds from the lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - run: make audit
      - run: make lint-scripts
      - run: docker build --build-arg REVISION=${{ github.sha }} -t air-model-gateway:ci .

  # The chart and Terraform that deploy this service are validated in
  # air-infrastructure-service's own CI (its `make gke-validate`), against this
  # repository's routing, pricing and policy files.
