[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "air-model-gateway"
version = "0.1.0"
description = "Central model gateway for the AIR platform: text generation and embeddings behind one API, model classes with failover, cost accounting, and observability — reached directly by every consumer in every environment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AIR Platform Team" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "redis>=5.0",
]

[project.optional-dependencies]
# Cloud model providers — Ollama needs no SDK (plain HTTP).
providers = [
    "anthropic>=0.39",
    "openai>=1.40",
    "google-genai>=1.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.4",
    "types-pyyaml>=6.0",
    "fakeredis[lua]>=2.23",
    "openapi-spec-validator>=0.7",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/bookbee/air-model-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/air_model_gateway", "src/air_model_gateway_client"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() / Header() in defaults is idiomatic
    "N818",   # HTTP-status exceptions use conventional names (Unauthorized, Forbidden, …)
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["air_model_gateway", "air_model_gateway_client"]

[tool.coverage.report]
# A floor, not a target: it stops coverage eroding unnoticed. Raise it when the
# suite grows; never lower it to make a change pass.
fail_under = 90
show_missing = true
skip_covered = true
