{{- if .Values.podDisruptionBudget.enabled }}
# Node upgrades and Autopilot rebalancing evict at most one replica at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "amg.fullname" . }}
  labels:
    {{- include "amg.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "amg.selectorLabels" . | nindent 6 }}
{{- end }}
