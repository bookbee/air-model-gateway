{{- if eq .Values.secrets.mode "gcpSecretManager" }}
# GKE Secret Manager add-on: each Secret Manager secret becomes a file in the
# pod's SECRETS_DIR, named like the env var it replaces. Access is the pod's
# own Kubernetes service account through Workload Identity Federation
# (granted per secret by deploy/terraform).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "amg.fullname" . }}-secrets
  labels:
    {{- include "amg.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range $file, $secret := .Values.secrets.gcp.items }}
      - resourceName: "projects/{{ $.Values.secrets.gcp.project }}/secrets/{{ $secret }}/versions/latest"
        path: "{{ $file }}"
      {{- end }}
{{- if .Values.redis.tls.enabled }}
---
# Memorystore's server CA, kept out of SECRETS_DIR: every file there is read
# as a setting.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "amg.fullname" . }}-redis-ca
  labels:
    {{- include "amg.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secrets.gcp.project }}/secrets/{{ .Values.redis.tls.gcpSecret }}/versions/latest"
        path: "ca.pem"
{{- end }}
{{- end }}
