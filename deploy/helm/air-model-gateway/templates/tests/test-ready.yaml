# `helm test <release>`: the Service answers, liveness and readiness pass.
# Uses the gateway's own image (Python, no extra pull, works on private
# registries). Authenticated checks live in deploy/gke/smoke.sh.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "amg.fullname" . }}-test-ready
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: {{ include "amg.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "amg.fullname" . }}:{{ .Values.service.port }}"
          for path in ("/v1/health", "/v1/ready"):
              with urllib.request.urlopen(base + path, timeout=10) as r:
                  print(path, r.status, json.load(r))
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
