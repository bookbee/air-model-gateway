# What each model choice a caller can make means, in concrete models.
#
# Loaded at boot (schemas/gateway.py::RoutingDoc, gateway/models.py). This is
# owner-managed configuration, not code: changing which models serve a class,
# reordering a chain, or tuning one service is an edit here plus a redeploy,
# never a release. Who may use which class, embedding model or provider is in
# deploy/policy/policy.<env>.yaml.
#
# Callers choose by class, never by model name:
#   POST /v1/generate  model: local | auto | cloud   (default auto)
#                      provider: optional preference (moved to the front of the
#                      chain; the rest stay as fallback)
#   POST /v1/embed     model: a published embedding name, e.g. local-768-v1
# A chain is tried in order; on a provider error the router walks to the next.
#
# Every provider named here must be one air-model-gateway can build (ollama,
# anthropic, openai, gemini, llama.cpp). `llama.cpp` is the label for whatever
# is behind the one self-hosted settings slot (AIR_MODEL_GATEWAY_SELF_HOSTED__BASE_URL):
# today llama.cpp's `llama-server` (`make llamacpp-up`); vLLM/TGI in shared
# environments. If what runs there changes, rename the label to match.

generate:
  # Our own model servers only: free, and the prompt never leaves the network.
  # Three rungs but two failure domains: llama and ministral are both served
  # by the same ollama process (this covers one model not being loaded), and
  # llama.cpp is a separate process that survives ollama being down. Never a
  # cloud rung: `local` is a promise about where data goes, so if every local
  # model is down the call fails visibly instead of escalating to the cloud.
  local:
    - provider: ollama
      model: llama3.2:3b
    - provider: ollama
      model: ministral-3:3b
    - provider: llama.cpp
      model: llama-3.2-3b-gguf

  # Cloud models only. Cross-vendor, so one provider's outage doesn't remove the
  # class. Gemini leads because it is the provider with a working key in this
  # environment today; Anthropic and OpenAI are the fallback, not a lesser
  # choice. Revisit the order once all keys are live.
  cloud:
    - provider: gemini
      model: gemini-2.5-flash
    - provider: anthropic
      model: claude-haiku-4-5
    - provider: openai
      model: gpt-4o-mini

  # The gateway's choice, and the default. Local first (free and private while
  # the local model is healthy), then cloud as fallback. A caller whose data must
  # not leave the network asks for `local`, not `auto`.
  auto:
    - provider: ollama
      model: llama3.2:3b
    - provider: gemini
      model: gemini-2.5-flash
    - provider: anthropic
      model: claude-haiku-4-5
    - provider: openai
      model: gpt-4o-mini

# Embedding models, by permanent name: <local|cloud>-<dimensions>-v<version>.
# A name never changes meaning once published: vectors from different models
# can't share an index, so pointing an existing name at another model would
# silently corrupt every index built with it. To change models, publish a new
# version (v2) and re-index. Exactly one model per name, never a fallback chain,
# for the same reason: an embedding outage must fail visibly.
embed:
  # air-rag's indexing and query embeddings.
  local-768-v1:
    provider: ollama
    model: nomic-embed-text
    dimensions: 768

  # Optional cloud space, for a caller that can't depend on local servers. No
  # llama.cpp equivalent exists: that instance serves a chat model, and
  # llama-server serves one or the other per process.
  cloud-1536-v1:
    provider: openai
    model: text-embedding-3-small
    dimensions: 1536

# Per-service tuning of what a class means for that one service. A service not
# listed here gets the classes above. This keeps each consumer's behaviour its
# own: tuning one service's models never moves another's.
overrides:
  air-classifier-service:
    generate:
      # Tier 2 and the summary refresh. Exactly one rung, deliberately: the
      # classifier's own ladder decides whether to escalate when the local
      # model can't serve, and it can only do that if a local outage actually
      # fails the call. A failed summary refresh keeps the prior narrative.
      local:
        - provider: ollama
          model: llama3.2:3b
      # Tier 3: the classifier has already decided local (Tier 2) wasn't
      # confident enough, so its `auto` is cloud-only, at the cheap end.
      auto:
        - provider: gemini
          model: gemini-2.5-flash
        - provider: anthropic
          model: claude-haiku-4-5
        - provider: openai
          model: gpt-4o-mini
      # Arbitration, when even Tier 3 isn't confident: the strongest models.
      # gemini-3.1-pro-preview is a *preview* and Google withdraws those; the
      # Claude rung keeps the class serving, and the GA name replaces it then
      # (with its row in pricing.yaml).
      cloud:
        - provider: gemini
          model: gemini-3.1-pro-preview
        - provider: anthropic
          model: claude-sonnet-5
        - provider: openai
          model: gpt-4o-mini

  air-orchestrator-service:
    generate:
      # Customer- and business-channel answers (and the structured business
      # call). Flash leads for latency: a customer-facing turn can't wait the
      # 5-8 s a Pro model takes. Sonnet second: a customer answer falling back
      # should not drop to the smallest model.
      cloud:
        - provider: gemini
          model: gemini-2.5-flash
        - provider: anthropic
          model: claude-sonnet-5
        - provider: openai
          model: gpt-4o-mini
