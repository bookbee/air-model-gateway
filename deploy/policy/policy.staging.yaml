# Staging policy: the same shape as policy.local.yaml, with no default_allow.
#
# Outside `local` the engine ignores default_allow anyway; it is written as
# false here so the file reads the way it behaves. Every consumer needs an
# explicit grant, and anything not listed is denied (403).

default_allow: false
default_rate_per_minute: 60

# Calls per minute this deployment may send to each provider, summed over every
# service (a rung over quota is skipped and the chain fails over). Set from the
# provider account's own limits, below them; omit a provider for no cap.
# Provider names: ollama, anthropic, openai, gemini, llama.cpp.
# STARTING VALUES, chosen without knowing the accounts' tiers: the owner sets
# them from each account's published limit (with headroom) and observed load
# (`air_model_gateway_provider_quota_rejected_total`).
provider_quotas:
  anthropic: 120
  openai: 120
  gemini: 120

# Per service, optional (unset = every choice routing.yaml offers):
#   model_classes: [local, auto]        /v1/generate classes it may use
#   embed_models: [local-768-v1]        /v1/embed names it may use
#   preferred_providers: [anthropic]    providers it may name in `provider`
#   pin: true                           may send `pin` (exact provider:model).
#                                       Operator tools only.
#   daily_budget_usd: 25.0              USD per UTC day; past it, paid calls get
#                                       429 budget_exceeded until midnight UTC
#                                       (cache hits still served).
#
# Every service that can reach a paid model (a class with a cloud rung, a cloud
# embedding model, or pin) must have a daily_budget_usd: the gateway refuses
# to start without one outside local, because on a gateway shared by many
# projects an uncapped service is unlimited spend on the shared accounts. The
# budgets below are STARTING VALUES for the owner to set from observed spend
# (`air_model_gateway_service_cost_usd_total`).

services:
  air-classifier-service:
    resources:
      inference: [generate, embed]
    rate_per_minute: 300
    daily_budget_usd: 5.0

  air-orchestrator-service:
    resources:
      inference: [generate, embed]
    rate_per_minute: 600
    daily_budget_usd: 10.0

  air-tools:
    resources:
      inference: [generate]
    rate_per_minute: 300
    daily_budget_usd: 5.0

  air-rag:
    resources:
      inference: [embed]
    # Its index's embedding model, and only that: vectors from any other model
    # couldn't be stored next to it.
    embed_models: [local-768-v1]
    rate_per_minute: 600

  # Operator console: generate for its model tab, admin_read for its policy probe.
  air-web-console:
    resources:
      inference: [generate]
      admin: [admin_read]
    rate_per_minute: 60
    pin: true  # the operator tests exact models
    daily_budget_usd: 2.0
