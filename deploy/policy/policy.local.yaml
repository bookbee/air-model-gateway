# Local policy: who can call air-model-gateway and how fast.
# Loaded by air_model_gateway.policy.engine at boot. policy.staging.yaml and
# policy.prod.yaml are the same shape and enforced strictly (no default-allow);
# they also document provider_quotas, the model-choice grants (model_classes,
# embed_models, preferred_providers, pin) and daily_budget_usd.
#
# A rule grants a service a set of actions on a resource, with an optional
# per-minute rate override. `default_allow: true` is a LOCAL convenience only,
# and locally any service may `pin` an exact model.
# Model calls are the resource `inference`; its actions are the operations,
# named after their routes: `generate` (POST /v1/generate) and `embed`
# (POST /v1/embed). `admin` / `admin_read` guards GET /v1/admin/policy.

default_allow: true
default_rate_per_minute: 120

services:
  air-classifier-service:
    resources:
      inference: [generate, embed]  # escalation ladder T2/T3
    rate_per_minute: 300

  air-orchestrator-service:
    resources:
      inference: [generate, embed]
    rate_per_minute: 600

  air-web-console:
    resources:
      inference: [generate]
    rate_per_minute: 60

  air-tools:
    resources:
      inference: [generate]  # cloud, for agent steps
    rate_per_minute: 300

  air-rag:
    resources:
      inference: [embed]  # local-768-v1; no generation use today
    # Ingestion embeds in batches, one call per batch, so this is batches/min.
    rate_per_minute: 600
