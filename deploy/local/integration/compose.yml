# Local integration stack: a laptop test harness, never deployed. The production
# image with the staging configuration, so consumers running on this machine can
# be integration-tested against a production-shaped gateway. (Real staging is
# GKE: deploy/gke/values-staging.yaml.)
#
#   2 gateway replicas   ENVIRONMENT=staging (policy fails closed), JSON logs,
#                        secrets from files (SECRETS_DIR), shared Redis
#   nginx                one entry point on :9083, round-robin over replicas
#
# Started with `make integration-up` (which generates the secrets first). Redis
# is air-infrastructure-service's, reached through the host on :6379; Ollama and
# llama-server are the host's own.
name: air-model-gateway-integration

services:
  gateway:
    build:
      context: ../../..
      # The checkout's revision, which the Makefile exports; /v1/health reports it.
      args:
        REVISION: ${AIR_MODEL_GATEWAY_REVISION:-unknown}
    image: air-model-gateway:local
    deploy:
      replicas: 2
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AIR_MODEL_GATEWAY_ENVIRONMENT: staging
      AIR_MODEL_GATEWAY_LOG__RENDER: json
      AIR_MODEL_GATEWAY_POLICY__CONFIG_PATH: deploy/policy/policy.staging.yaml
      AIR_MODEL_GATEWAY_SECRETS_DIR: /run/secrets/air-model-gateway
      AIR_MODEL_GATEWAY_OLLAMA__BASE_URL: http://host.docker.internal:11434
      AIR_MODEL_GATEWAY_SELF_HOSTED__BASE_URL: http://host.docker.internal:8181/v1
      # Own namespace, so this stack never shares cache entries, rate-limit
      # buckets or spend with a local `make run REDIS=infra` on the same Redis.
      AIR_MODEL_GATEWAY_REDIS__KEY_PREFIX: "air-model-gateway-integration:"
    volumes:
      - ./secrets:/run/secrets/air-model-gateway:ro

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["9083:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [gateway]
