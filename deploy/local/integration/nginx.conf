# Round-robin over the gateway replicas. Docker's DNS resolves `gateway` to
# every replica; the `resolver` + variable form re-resolves it every 10s, so
# scaling the replica count (or a replica restarting with a new IP) needs no
# nginx reload.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    # Model calls can take a while; the gateway's own deadlines are tighter.
    proxy_read_timeout 180s;
    client_max_body_size 4m;

    location / {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        # Streams (`stream: true`) must reach the caller event by event. The
        # gateway also sends X-Accel-Buffering: no; this makes it explicit.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        # Which replica answered: lets an integration test see the balancing.
        add_header X-Served-By $upstream_addr always;
    }
}
